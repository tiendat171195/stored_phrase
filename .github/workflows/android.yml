name: Android CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and build
        run: >
          ./gradlew --no-daemon
          :core:test
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleDebugAndroidTest
          :app:assembleRelease

      - name: Check that the APK has no network permission
        run: |
          APKANALYZER=$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f | head -1)
          PERMS=$("$APKANALYZER" manifest permissions app/build/outputs/apk/debug/app-debug.apk)
          echo "$PERMS"
          if echo "$PERMS" | grep -q "android.permission.INTERNET"; then
            echo "::error::INTERNET permission found in the APK"
            exit 1
          fi

      - name: Upload debug APK (fake test data only)
        uses: actions/upload-artifact@v4
        with:
          name: stored-phrase-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            core/build/reports/
          retention-days: 7
